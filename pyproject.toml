[project]
name = "hw1-sine-rnn"
version = "1.00"
description = "AI Agent Orchestration - Sine Wave Denoising HW1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
    "pytest>=8.0.0",
    "torch>=2.2.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.report]
fail_under = 85
